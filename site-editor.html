<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Gold Website Editor</title><style>:root{--g:#f4c44e;--bg:#070707;--card:#111;--line:#2d2d2d;--muted:#aaa}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#fff}.wrap{max-width:1050px;margin:auto;padding:20px}h1,h2,h3{color:var(--g)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:10px 0 5px;color:#ddd}input,textarea{width:100%;padding:12px;background:#070707;border:1px solid #333;border-radius:8px;color:#fff;font:inherit}textarea{min-height:95px;resize:vertical}button,a.btn{display:inline-block;padding:12px 16px;border:0;border-radius:9px;background:var(--g);color:#111;font-weight:900;text-decoration:none;cursor:pointer}.secondary{background:#252525!important;color:#fff!important}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.hidden{display:none}.status{color:var(--g);margin-top:10px}.plans{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.plan{border:1px solid #333;border-radius:12px;padding:14px;background:#0b0b0b}.small{font-size:12px;color:var(--muted)}.switch{width:auto}@media(max-width:720px){.row,.plans{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>IT Gold Website & Pricing</h1><div class="card" id="login"><h3>Admin Access</h3><p class="small">Use your IT Gold admin PIN.</p><input id="pin" type="password" inputmode="numeric" placeholder="Admin PIN"><button id="loginBtn">OPEN EDITOR</button><div id="loginStatus" class="status"></div></div><div id="app" class="hidden"><div class="toolbar"><a class="btn secondary" href="/admin.html">← CUSTOMER ADMIN</a><a class="btn secondary" href="/" target="_blank">VIEW WEBSITE</a><button id="refreshBtn" class="secondary">REFRESH</button></div><div class="card"><h2>Website Text</h2><div class="row"><div><label>Brand Name</label><input data-setting="site_brand"></div><div><label>Main Headline</label><input data-setting="site_hero_title"></div></div><label>Headline Description</label><textarea data-setting="site_hero_subtitle"></textarea><div class="row"><div><label>Existing Customer Title</label><input data-setting="existing_customer_title"></div><div><label>Trial Title</label><input data-setting="trial_title"></div></div><label>Existing Customer Text</label><textarea data-setting="existing_customer_text"></textarea><label>Trial Text</label><textarea data-setting="trial_text"></textarea><div class="row"><div><label>Activation Section Title</label><input data-setting="activation_title"></div><div><label>Login Section Title</label><input data-setting="credentials_title"></div></div><label>Activation Instructions</label><textarea data-setting="activation_text"></textarea><label>Login Section Text</label><textarea data-setting="credentials_text"></textarea><button id="saveText">SAVE WEBSITE TEXT</button><div id="textStatus" class="status"></div></div><div class="card"><h2>Payment & Setup</h2><div class="row"><div><label>Cash App Handle</label><input data-setting="cash_app_handle"></div><div><label>Cash App Link</label><input data-setting="cash_app_url"></div><div><label>Venmo Handle</label><input data-setting="venmo_handle"></div><div><label>Venmo Link</label><input data-setting="venmo_url"></div><div><label>Downloader Code</label><input data-setting="downloader_code"></div><div><label>Fallback Downloader Code</label><input data-setting="fallback_downloader_code"></div></div><label>Setup Time Message</label><input data-setting="setup_window"><button id="savePayments">SAVE PAYMENT & SETUP</button><div id="paymentStatus" class="status"></div></div><div class="card"><h2>Plan Prices</h2><p class="small">Change a price here and the website checkout will use the same database price. You can also temporarily hide a plan.</p><div id="plans" class="plans"></div><div id="planStatus" class="status"></div></div></div></div><script>const endpoint='https://bhfnlzvldmvwbuujexcj.supabase.co/functions/v1/itgold-site-admin';let adminPin='',data={settings:{},plans:[]};async function api(method,body){const r=await fetch(endpoint,{method,headers:{'content-type':'application/json','x-admin-pin':adminPin},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fill(){document.querySelectorAll('[data-setting]').forEach(el=>el.value=data.settings[el.dataset.setting]||'');plans.innerHTML=data.plans.map(p=>`<div class="plan" data-plan="${p.id}"><h3>${esc(p.billing_cycle==='monthly'?'Monthly':'Annual')} — ${p.connections} Connection${p.connections>1?'s':''}</h3><label>Plan Name</label><input data-name value="${esc(p.name)}"><label>Price ($)</label><input data-price type="number" min="0" step="0.01" value="${(p.price_cents/100).toFixed(2)}"><label><input class="switch" type="checkbox" data-active ${p.active?'checked':''}> Show this plan on website</label><button data-save-plan>SAVE PLAN</button></div>`).join('')}async function load(){data=await api('GET');fill()}loginBtn.onclick=async()=>{adminPin=pin.value.trim();try{await load();sessionStorage.setItem('itgold_admin_pin',adminPin);login.classList.add('hidden');app.classList.remove('hidden')}catch(e){loginStatus.textContent=e.message}};refreshBtn.onclick=load;async function saveSettings(statusId,keys){const settings={};keys.forEach(k=>{const el=document.querySelector(`[data-setting="${k}"]`);settings[k]=el?.value.trim()||''});const st=document.getElementById(statusId);st.textContent='Saving...';try{await api('POST',{action:'save_settings',settings});st.textContent='Saved ✓';await load()}catch(e){st.textContent=e.message}};saveText.onclick=()=>saveSettings('textStatus',['site_brand','site_hero_title','site_hero_subtitle','existing_customer_title','existing_customer_text','trial_title','trial_text','activation_title','activation_text','credentials_title','credentials_text']);savePayments.onclick=()=>saveSettings('paymentStatus',['cash_app_handle','cash_app_url','venmo_handle','venmo_url','downloader_code','fallback_downloader_code','setup_window']);document.addEventListener('click',async e=>{if(!e.target.matches('[data-save-plan]'))return;const box=e.target.closest('[data-plan]');const price=Math.round(Number(box.querySelector('[data-price]').value||0)*100);const name=box.querySelector('[data-name]').value.trim();const active=box.querySelector('[data-active]').checked;planStatus.textContent='Saving plan...';try{await api('POST',{action:'save_plan',id:box.dataset.plan,price_cents:price,name,active});planStatus.textContent='Plan saved ✓';await load()}catch(err){planStatus.textContent=err.message}});const saved=sessionStorage.getItem('itgold_admin_pin');if(saved){adminPin=saved;load().then(()=>{login.classList.add('hidden');app.classList.remove('hidden')}).catch(()=>sessionStorage.removeItem('itgold_admin_pin'))}</script></body></html>
