<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Gold Admin</title><style>body{margin:0;font-family:Arial,sans-serif;background:#070707;color:#fff}.wrap{max-width:1100px;margin:auto;padding:20px}h1,h2,h3{color:#f4c44e}.card{background:#111;border:1px solid #2c2c2c;border-radius:14px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input{width:100%;padding:12px;background:#060606;color:#fff;border:1px solid #333;border-radius:8px;box-sizing:border-box}button{padding:12px 16px;background:#f4c44e;color:#111;border:0;border-radius:8px;font-weight:900;cursor:pointer}.muted{color:#aaa}.hidden{display:none}.status{color:#f4c44e;margin-top:8px}.pill{display:inline-block;padding:5px 8px;background:#222;border-radius:999px;font-size:12px}.item{border-top:1px solid #292929;padding-top:14px;margin-top:14px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>IT Gold Admin</h1><div class="card" id="loginBox"><h3>Admin Access</h3><p class="muted">Enter your private IT Gold admin PIN.</p><input id="pin" type="password" inputmode="numeric" placeholder="Admin PIN"><button id="loginBtn">OPEN ORDERS</button><div class="status" id="loginStatus"></div></div><div id="app" class="hidden"><button id="refreshBtn">REFRESH</button><div id="orders"></div><div id="trials"></div></div></div><script>const endpoint='https://bhfnlzvldmvwbuujexcj.supabase.co/functions/v1/itgold-admin';let adminPin='';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(method,body){const r=await fetch(endpoint,{method,headers:{'content-type':'application/json','x-admin-pin':adminPin},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){const d=await api('GET');orders.innerHTML='<h2>Paid Orders</h2>'+((d.orders||[]).map(o=>card('order',o)).join('')||'<div class="card">No orders yet.</div>');trials.innerHTML='<h2>Trial Requests</h2>'+((d.trials||[]).map(t=>card('trial',t)).join('')||'<div class="card">No trials yet.</div>')}function card(type,x){const ref=type==='order'?x.public_order_ref:x.public_trial_ref,c=type==='order'?(x.customer||{}):x,sub=type==='order'?`${x.plan?.name||''} • $${((x.amount_cents||0)/100).toFixed(2)}`:'24-Hour Trial';return `<div class="card" data-type="${type}" data-id="${x.id}"><h3>${esc(ref)} <span class="pill">${esc(x.status)}</span></h3><p>${esc(c.full_name)} • ${esc(c.email)} • ${esc(c.phone)}</p><p class="muted">${esc(c.device_type||'')} ${esc(sub)}</p><div class="row"><input data-k="username" placeholder="Username"><input data-k="password" placeholder="Password"></div><div class="row"><input data-k="dns_link" placeholder="Server / DNS (optional)"><input data-k="dns_link_for_samsung_lg" placeholder="Samsung/LG DNS (optional)"></div><div class="row"><input data-k="package_name" placeholder="Package / note (optional)"><input data-k="expires_at" type="datetime-local"></div><label style="display:block;margin:12px 0"><input data-k="fallback" type="checkbox" style="width:auto"> Use alternate Smarters app for this customer</label><button data-save>SAVE & RELEASE CREDENTIALS</button><div class="status"></div></div>`}loginBtn.onclick=async()=>{adminPin=pin.value.trim();try{await load();loginBox.classList.add('hidden');app.classList.remove('hidden');sessionStorage.setItem('itgold_admin_pin',adminPin)}catch(e){loginStatus.textContent=e.message}};refreshBtn.onclick=load;document.addEventListener('click',async e=>{if(!e.target.matches('[data-save]'))return;const box=e.target.closest('[data-id]'),q=k=>box.querySelector(`[data-k="${k}"]`);e.target.disabled=true;e.target.textContent='SAVING...';try{await api('POST',{type:box.dataset.type,id:box.dataset.id,username:q('username').value.trim(),password:q('password').value.trim(),dns_link:q('dns_link').value.trim(),dns_link_for_samsung_lg:q('dns_link_for_samsung_lg').value.trim(),package_name:q('package_name').value.trim(),expires_at:q('expires_at').value?new Date(q('expires_at').value).toISOString():null,use_fallback_app:q('fallback').checked});box.querySelector('.status').textContent='Credentials released to customer portal.';e.target.textContent='SAVED'}catch(err){box.querySelector('.status').textContent=err.message;e.target.disabled=false;e.target.textContent='SAVE & RELEASE CREDENTIALS'}});const saved=sessionStorage.getItem('itgold_admin_pin');if(saved){adminPin=saved;load().then(()=>{loginBox.classList.add('hidden');app.classList.remove('hidden')}).catch(()=>sessionStorage.removeItem('itgold_admin_pin'))}</script></body></html>
