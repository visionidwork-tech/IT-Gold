<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Revised Owner Admin</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap');:root{--g:#e3b83f;--g2:#ffe88a;--bg:#000;--card:#080808;--line:#4b3a12;--muted:#aaa;--text:#fff}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:#000;color:var(--text)}.wrap{max-width:1380px;margin:auto;padding:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.16em}.brand b{color:var(--g)}.owner{color:var(--g);font-size:10px;letter-spacing:.18em;margin-top:6px}.view,.tabs button,.btn{border:1px solid #4b4028;background:#080808;color:var(--text);padding:11px 15px;border-radius:10px;text-decoration:none;font-weight:700;cursor:pointer}.login{max-width:470px;margin:9vh auto;background:#080808;border:1px solid #4b3a12;border-radius:22px;padding:34px;text-align:center}.login span{color:var(--g);font-size:10px;letter-spacing:.18em;font-weight:700}.login h1{font:400 42px 'DM Serif Display';margin:10px 0}.login p,.muted{color:var(--muted)}.pin,input{width:100%;padding:14px;background:#020202;border:1px solid #4b3a12;border-radius:10px;color:#fff;font:inherit}.pin{font-size:28px;text-align:center;letter-spacing:.35em;margin:14px 0}.loginbtn,.gold{padding:14px;background:linear-gradient(180deg,#ffe784,#d6a72d);color:#111;border:0;border-radius:10px;font-weight:800;cursor:pointer}.loginbtn{width:100%}.status{color:#e8ca86;margin-top:10px}.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button.active{background:var(--g);color:#111;border-color:var(--g)}.panel{display:none}.panel.active{display:block}.frame{width:100%;height:calc(100vh - 150px);min-height:760px;border:1px solid var(--line);border-radius:18px;background:#000}.resgrid{display:grid;grid-template-columns:380px 1fr;gap:16px}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px}.card h2,.card h3{color:var(--g2);margin-top:0}.field{margin:10px 0}.field label{display:block;color:#ccc;font-size:12px;margin-bottom:5px}.reseller{border:1px solid #2f2a1c;border-radius:12px;padding:13px;margin:10px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#173522;color:#9ff2c3}.pill.off{background:#321818;color:#ffb0b0}.danger{background:#351515;color:#ffd0d0;border:1px solid #693333}.quick{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:#888}@media(max-width:800px){.wrap{padding:10px}.tabs{display:grid;grid-template-columns:1fr 1fr}.tabs button{font-size:11px}.resgrid{grid-template-columns:1fr}.frame{min-height:720px}.toolbar{align-items:flex-start}}</style></head><body><div class="wrap"><div class="toolbar"><div><div class="brand">IT <b>REVISED</b></div><div class="owner">OWNER CONTROL CENTER</div></div><a class="view" href="/" target="_blank">VIEW STOREFRONT</a></div><section class="login" id="loginBox"><span>SECURE OWNER ACCESS</span><h1>Enter Admin PIN</h1><p>One login opens your complete IT Revised control center.</p><input class="pin" id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button class="loginbtn" id="loginBtn">OPEN OWNER DASHBOARD</button><div id="loginStatus" class="status"></div></section><div id="app" class="hidden"><div class="tabs"><button class="active" data-panel="customers">CUSTOMERS & ORDERS</button><button data-panel="website">WEBSITE & PRICING</button><button data-panel="renewals">RENEWALS</button><button data-panel="resellers">RESELLERS</button><button id="logoutBtn">LOG OUT</button></div><div id="customers" class="panel active"><iframe class="frame" src="/customer-admin.html" title="Customers and Orders"></iframe></div><div id="website" class="panel"><iframe class="frame" src="/site-editor.html" title="Website and Pricing"></iframe></div><div id="renewals" class="panel"><iframe class="frame" src="/admin-renewals.html" title="Renewals"></iframe></div><div id="resellers" class="panel"><div class="resgrid"><section class="card"><h2>Add Reseller</h2><p class="muted">Create the reseller here without leaving Owner Admin.</p><div class="field"><label>Reseller / business name</label><input id="resellerName"></div><div class="field"><label>Reseller email</label><input id="resellerEmail" type="email"></div><div class="field"><label>Temporary password</label><input id="tempPassword" type="password"></div><button class="gold" id="createReseller">CREATE RESELLER</button><div class="status" id="createStatus"></div></section><section class="card"><div class="quick"><div><h2 style="margin-bottom:4px">Your Resellers</h2><p class="muted" style="margin-top:0">Manage access and copy each storefront link.</p></div><button class="btn" id="refreshResellers">REFRESH</button></div><div id="resellerList"><p class="muted">Loading…</p></div></section></div></div></div></div><script>const endpoint='https://bhfnlzvldmvwbuujexcj.supabase.co/functions/v1/itgold-admin';let adminPin='';const $=id=>document.getElementById(id);async function api(method,body){const r=await fetch(endpoint,{method,headers:{'content-type':'application/json','x-admin-pin':adminPin},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openApp(){loginBox.classList.add('hidden');app.classList.remove('hidden')}function renderResellers(rows){resellerList.innerHTML=(rows||[]).map(r=>`<div class="reseller"><div><b>${esc(r.display_name)}</b><div class="small">${esc(r.slug)}</div><div class="small">it-gold-reseller-template.vercel.app/?r=${esc(r.slug)}</div></div><div><span class="pill ${r.active?'':'off'}">${r.active?'ACTIVE':'PAUSED'}</span><div class="quick" style="margin-top:8px"><button class="btn" data-copy="https://it-gold-reseller-template.vercel.app/?r=${esc(r.slug)}">COPY LINK</button><button class="btn ${r.active?'danger':''}" data-toggle="${r.id}" data-active="${r.active?'0':'1'}">${r.active?'PAUSE':'ACTIVATE'}</button></div></div></div>`).join('')||'<p class="muted">No resellers yet.</p>'}async function loadMaster(){const d=await api('GET');renderResellers(d.resellers||[]);return d}loginBtn.onclick=async()=>{adminPin=pin.value.trim();if(!/^\d{4}$/.test(adminPin)){loginStatus.textContent='Enter your 4-digit Admin PIN.';return}loginStatus.textContent='Checking…';try{await loadMaster();sessionStorage.setItem('itgold_admin_pin',adminPin);openApp()}catch(e){loginStatus.textContent=e.message}};document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-panel]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.panel).classList.add('active');if(b.dataset.panel==='resellers')loadMaster().catch(()=>{})});logoutBtn.onclick=()=>{sessionStorage.removeItem('itgold_admin_pin');location.reload()};refreshResellers.onclick=()=>loadMaster();createReseller.onclick=async()=>{createStatus.textContent='Creating reseller…';try{const d=await api('POST',{action:'create_reseller',displayName:resellerName.value.trim(),email:resellerEmail.value.trim(),password:tempPassword.value});createStatus.textContent='Created ✓ Storefront: https://it-gold-reseller-template.vercel.app/?r='+d.reseller.slug;resellerName.value=resellerEmail.value=tempPassword.value='';await loadMaster()}catch(e){createStatus.textContent=e.message}};document.addEventListener('click',async e=>{if(e.target.dataset.copy){await navigator.clipboard.writeText(e.target.dataset.copy);e.target.textContent='COPIED ✓';setTimeout(()=>e.target.textContent='COPY LINK',1200)}if(e.target.dataset.toggle){e.target.disabled=true;try{await api('POST',{action:'set_reseller_active',id:e.target.dataset.toggle,active:e.target.dataset.active==='1'});await loadMaster()}catch(err){alert(err.message);e.target.disabled=false}}});const saved=sessionStorage.getItem('itgold_admin_pin');if(saved){adminPin=saved;loadMaster().then(openApp).catch(()=>sessionStorage.removeItem('itgold_admin_pin'))}</script></body></html>
