<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Gold Owner Admin</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap');:root{--g:#d6ad55;--bg:#0b0c0f;--card:#15171c;--line:#292a30;--muted:#a8a6a0;--text:#f7f2e8}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at top,#211a0d,#0b0c0f 34%);color:var(--text)}.wrap{max-width:1380px;margin:auto;padding:22px}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:10px 0 22px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.16em}.brand b{color:var(--g)}.owner{color:var(--g);font-size:10px;letter-spacing:.18em;margin-top:6px}.view,.tabs button{border:1px solid #4b4028;background:#15171c;color:var(--text);padding:11px 15px;border-radius:10px;text-decoration:none;font-weight:700;cursor:pointer}.login{max-width:470px;margin:9vh auto;background:linear-gradient(180deg,#191b20,#121318);border:1px solid #3a3428;border-radius:22px;padding:34px;text-align:center;box-shadow:0 30px 90px #0008}.login span{color:var(--g);font-size:10px;letter-spacing:.18em;font-weight:700}.login h1{font:400 42px 'DM Serif Display';margin:10px 0}.login p{color:var(--muted);line-height:1.6}.pin{width:100%;padding:17px;background:#090a0d;border:1px solid #3a3b42;border-radius:11px;color:var(--g);font-size:28px;text-align:center;letter-spacing:.35em;margin:14px 0}.loginbtn{width:100%;padding:14px;background:var(--g);color:#111;border:0;border-radius:10px;font-weight:800;cursor:pointer}.status{color:#e8ca86;margin-top:12px}.hidden{display:none}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.tabs button.active{background:var(--g);color:#111;border-color:var(--g)}.panel{display:none}.panel.active{display:block}iframe{width:100%;height:calc(100vh - 170px);min-height:760px;border:1px solid var(--line);border-radius:18px;background:#0b0c0f}.small{font-size:12px;color:var(--muted)}@media(max-width:700px){.wrap{padding:12px}.toolbar{align-items:flex-start}.view{font-size:11px}.login{margin-top:6vh;padding:28px 20px}.tabs button{flex:1;font-size:11px}iframe{min-height:720px}}</style></head><body><div class="wrap"><div class="toolbar"><div><div class="brand">IT <b>GOLD</b></div><div class="owner">OWNER ADMIN</div></div><a class="view" href="/" target="_blank">VIEW STOREFRONT</a></div><section class="login" id="loginBox"><span>SECURE OWNER ACCESS</span><h1>Enter Admin PIN</h1><p>Use your private 4-digit owner PIN to open the IT Gold control center.</p><input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••"><button class="loginbtn" id="loginBtn">OPEN ADMIN DASHBOARD</button><div id="loginStatus" class="status"></div></section><div id="app" class="hidden"><div class="tabs"><button class="active" data-panel="customers">CUSTOMERS & ORDERS</button><button data-panel="website">WEBSITE & PRICING</button><button data-panel="renewals">RENEWALS</button><button id="logoutBtn">LOG OUT</button></div><div id="customers" class="panel active"><iframe src="/customer-admin.html" title="Customer Admin"></iframe></div><div id="website" class="panel"><iframe src="/site-editor.html" title="Website and Pricing"></iframe></div><div id="renewals" class="panel"><iframe src="/admin-renewals.html" title="Renewals"></iframe></div></div></div><script>const endpoint='https://bhfnlzvldmvwbuujexcj.supabase.co/functions/v1/itgold-admin';async function verify(pin){const r=await fetch(endpoint,{method:'GET',headers:{'content-type':'application/json','x-admin-pin':pin}});if(!r.ok)throw Error('Incorrect admin PIN');return true}function openApp(){loginBox.classList.add('hidden');app.classList.remove('hidden')}loginBtn.onclick=async()=>{const p=pin.value.trim();if(!/^\d{4}$/.test(p)){loginStatus.textContent='Enter your 4-digit Admin PIN.';return}loginStatus.textContent='Checking...';try{await verify(p);sessionStorage.setItem('itgold_admin_pin',p);openApp()}catch(e){loginStatus.textContent=e.message}};document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-panel]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.panel).classList.add('active')});logoutBtn.onclick=()=>{sessionStorage.removeItem('itgold_admin_pin');location.reload()};const saved=sessionStorage.getItem('itgold_admin_pin');if(saved){verify(saved).then(openApp).catch(()=>sessionStorage.removeItem('itgold_admin_pin'))}</script></body></html>
