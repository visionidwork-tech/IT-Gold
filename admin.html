<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Gold Admin</title><style>:root{--g:#f4c44e;--bg:#070707;--card:#111;--line:#2c2c2c;--muted:#aaa}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#fff}.wrap{max-width:1320px;margin:auto;padding:18px}h1,h2,h3{color:var(--g)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.hidden{display:none}.status{color:var(--g);margin-top:10px}.toolbar,.tabs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:space-between;margin-bottom:12px}.tabs{margin:12px 0}.tabs button,.toolbar button,.toolbar a{padding:12px 16px;border-radius:9px;border:1px solid #333;background:#171717;color:#ddd;font-weight:900;text-decoration:none;cursor:pointer}.tabs button.active{background:var(--g);color:#111;border-color:var(--g)}input{width:100%;padding:13px;background:#060606;color:#fff;border:1px solid #333;border-radius:8px;font:inherit}.loginbtn{margin-top:10px;padding:12px 16px;background:var(--g);color:#111;border:0;border-radius:8px;font-weight:900;cursor:pointer}.panel{display:none}.panel.active{display:block}iframe{width:100%;height:calc(100vh - 155px);min-height:760px;border:1px solid #252525;border-radius:14px;background:#070707}.small{font-size:12px;color:var(--muted)}@media(max-width:700px){.wrap{padding:10px}iframe{height:calc(100vh - 180px);min-height:700px}.toolbar{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="toolbar"><div><h1 style="margin:0">IT Gold Admin</h1><div class="small">Customers, trials, renewals, website text and pricing in one place.</div></div><a href="/" target="_blank">VIEW WEBSITE</a></div><div class="card" id="loginBox"><h3>Admin Access</h3><p class="small">Enter your private IT Gold admin PIN.</p><input id="pin" type="password" inputmode="numeric" placeholder="Admin PIN"><button class="loginbtn" id="loginBtn">OPEN ADMIN</button><div id="loginStatus" class="status"></div></div><div id="app" class="hidden"><div class="tabs"><button class="active" data-panel="customers">CUSTOMERS & ORDERS</button><button data-panel="website">WEBSITE & PRICING</button><button data-panel="renewals">RENEWALS</button><button id="logoutBtn">LOG OUT</button></div><div id="customers" class="panel active"><iframe src="/customer-admin.html" title="Customer Admin"></iframe></div><div id="website" class="panel"><iframe src="/site-editor.html" title="Website and Pricing"></iframe></div><div id="renewals" class="panel"><iframe src="/admin-renewals.html" title="Renewals"></iframe></div></div></div><script>const endpoint='https://bhfnlzvldmvwbuujexcj.supabase.co/functions/v1/itgold-admin';async function verify(pin){const r=await fetch(endpoint,{method:'GET',headers:{'content-type':'application/json','x-admin-pin':pin}});if(!r.ok)throw Error('Incorrect admin PIN');return true}function openApp(){loginBox.classList.add('hidden');app.classList.remove('hidden')}loginBtn.onclick=async()=>{const p=pin.value.trim();loginStatus.textContent='Checking...';try{await verify(p);sessionStorage.setItem('itgold_admin_pin',p);openApp()}catch(e){loginStatus.textContent=e.message}};document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-panel]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.panel).classList.add('active')});logoutBtn.onclick=()=>{sessionStorage.removeItem('itgold_admin_pin');location.reload()};const saved=sessionStorage.getItem('itgold_admin_pin');if(saved){verify(saved).then(openApp).catch(()=>sessionStorage.removeItem('itgold_admin_pin'))}</script></body></html>
