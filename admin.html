<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Gold Admin</title><style>:root{--g:#f4c44e;--bg:#070707;--card:#111;--line:#2c2c2c;--muted:#aaa;--green:#27c56f;--blue:#4aa3ff;--yellow:#f4c44e;--red:#ff5c5c}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#fff}.wrap{max-width:1280px;margin:auto;padding:20px}h1,h2,h3{color:var(--g)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#111;border:1px solid #2c2c2c;border-radius:14px;padding:16px}.stat strong{display:block;font-size:28px;color:var(--g)}input,textarea,select{width:100%;padding:12px;background:#060606;color:#fff;border:1px solid #333;border-radius:8px;font:inherit}textarea{min-height:130px;resize:vertical}button{padding:12px 16px;background:var(--g);color:#111;border:0;border-radius:8px;font-weight:900;cursor:pointer}.secondary{background:#252525;color:#fff}.green{background:var(--green);color:#06150b}.muted{color:var(--muted)}.hidden{display:none}.status{color:var(--g);margin-top:8px;white-space:pre-wrap}.pill{display:inline-block;padding:5px 8px;background:#222;border-radius:999px;font-size:12px}.pill.payment_claimed,.pill.requested{background:#5a4813;color:#ffe49b}.pill.activated,.pill.active{background:#153b28;color:#9ff2c3}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.nav button{background:#171717;color:#ddd;border:1px solid #333}.nav button.active{background:var(--g);color:#111}.section{display:none}.section.active{display:block}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.detail-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.pastebox{border:1px solid #5a4813;background:#181306;border-radius:12px;padding:14px;margin:14px 0}.pastebox h4{margin:0 0 8px;color:var(--g)}label{display:block;margin:10px 0 5px;color:#ddd}.small{font-size:12px;color:#888}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.empty{padding:22px;border:1px dashed #333;border-radius:12px;color:#999}.customerline{line-height:1.55}.notes{min-height:70px}.expiring{color:#ffd66e}.danger{color:#ff8a8a}@media(max-width:850px){.detail-grid,.grid3,.row{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><h1>IT Gold Admin</h1><div class="card" id="loginBox"><h3>Admin Access</h3><p class="muted">Enter your private IT Gold admin PIN.</p><input id="pin" type="password" inputmode="numeric" placeholder="Admin PIN"><button id="loginBtn">OPEN ADMIN</button><div class="status" id="loginStatus"></div></div><div id="app" class="hidden"><div class="toolbar"><button id="refreshBtn">REFRESH</button><button class="secondary" id="logoutBtn">LOG OUT</button></div><div class="grid3" id="stats"></div><div class="nav"><button class="active" data-tab="dashboard">Dashboard</button><button data-tab="paid">Paid Orders</button><button data-tab="trials">Trial Requests</button><button data-tab="active">Active Customers</button><button data-tab="expiring">Expiring Soon</button></div><section id="dashboard" class="section active"></section><section id="paid" class="section"></section><section id="trials" class="section"></section><section id="active" class="section"></section><section id="expiring" class="section"></section></div></div><script>const endpoint='https://bhfnlzvldmvwbuujexcj.supabase.co/functions/v1/itgold-admin';let adminPin='',cache={orders:[],trials:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(method,body){const r=await fetch(endpoint,{method,headers:{'content-type':'application/json','x-admin-pin':adminPin},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function cleanLine(s){return String(s||'').replace(/^[^A-Za-z0-9]+/,'').trim()}function pick(lines,labels){for(const raw of lines){const line=cleanLine(raw);for(const label of labels){const safe=label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp('^'+safe+'\\s*[:=-]\\s*(.+)$','i');const m=line.match(re);if(m&&m[1].trim())return m[1].trim()}}return ''}function parseCredentials(text){const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const joined=lines.join('\n');const username=pick(lines,['Username','User Name','User','Login','Login Username']);const password=pick(lines,['Password','Pass','Pwd']);const dns=pick(lines,['DNS (URL)','DNS URL','Server / DNS','Server','Server URL','DNS','Portal','Host','URL'])||((joined.match(/https?:\/\/[^\s]+/i)||[])[0]||'');const samsung=pick(lines,['Samsung & LG DNS (IPTV Smarters)','Samsung & LG DNS','Samsung/LG DNS','Samsung LG DNS','LG Samsung DNS','Smart TV URL','Samsung URL','LG URL']);const pkg=pick(lines,['Package','Bouquet','Plan','Subscription','Note','Notes']);const connections=pick(lines,['Connections','Connection','Max Connections','Screens','Devices']);const exp=pick(lines,['Expiry Date','Expiration Date','Expiration','Expires','Expiry','Expire Date','Exp Date']);return{username,password,dns_link:dns,dns_link_for_samsung_lg:samsung,package_name:pkg,connections,expires_raw:exp,raw:text}}function parseDateForInput(v){if(!v)return'';if(/24\s*h|24\s*hours?/i.test(v))return'';const d=new Date(v);if(Number.isNaN(d.getTime()))return'';const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}function applyParsed(box,p){const set=(k,v)=>{const el=box.querySelector(`[data-k="${k}"]`);if(el&&v)el.value=v};set('username',p.username);set('password',p.password);set('dns_link',p.dns_link);set('dns_link_for_samsung_lg',p.dns_link_for_samsung_lg);set('package_name',p.package_name);if(p.expires_raw){const parsed=parseDateForInput(p.expires_raw);if(parsed)set('expires_at',parsed);else if(/24\s*h|24\s*hours?/i.test(p.expires_raw)){const st=box.querySelector('[data-parse-status]');if(st)st.dataset.trial24='1'}}if(p.connections){const n=String(p.connections).match(/\d+/);if(n){const el=box.querySelector('[data-k="connections"]');if(el)el.value=n[0]}}}function statusLabel(s){return String(s||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}function card(type,x){const ref=type==='order'?x.public_order_ref:x.public_trial_ref,c=type==='order'?(x.customer||{}):x,sub=type==='order'?`${x.plan?.name||''} • $${((x.amount_cents||0)/100).toFixed(2)}`:'24-Hour Trial';const connections=type==='order'?(x.plan?.connections||1):1;return `<div class="card" data-type="${type}" data-id="${x.id}"><div class="order-head"><div><h3 style="margin:0">${esc(ref)} <span class="pill ${esc(x.status)}">${esc(statusLabel(x.status))}</span></h3><p class="customerline">${esc(c.full_name)}<br>${esc(c.email)} • ${esc(c.phone)}<br><span class="muted">${esc(c.device_type||'')} • ${esc(sub)}</span></p></div></div><div class="detail-grid"><div><div class="pastebox"><h4>Paste Credentials From Your Panel</h4><p class="small">Paste the full copied block exactly as your provider panel gives it to you. The parser is tuned for your panel format, including the emoji labels.</p><textarea data-k="rawpaste" placeholder="👤 Username: ...\n🔑 Password: ...\n🔗 DNS (URL): ...\n📺 Samsung & LG DNS (IPTV Smarters): ...\n📦 Package: ...\n📅 Expiry Date: ..."></textarea><div class="toolbar"><button type="button" data-parse>PARSE CREDENTIALS</button><button type="button" class="secondary" data-clear>CLEAR</button></div><div class="status" data-parse-status></div></div><label>Username</label><input data-k="username" placeholder="Username"><label>Password</label><input data-k="password" placeholder="Password"><div class="row"><div><label>Server / DNS</label><input data-k="dns_link" placeholder="Server / DNS"></div><div><label>Samsung/LG DNS</label><input data-k="dns_link_for_samsung_lg" placeholder="Samsung/LG DNS (optional)"></div></div><div class="row"><div><label>Package / Note</label><input data-k="package_name" placeholder="Package / note"></div><div><label>Connections</label><input data-k="connections" inputmode="numeric" value="${connections}"></div></div><label>Expiration</label><input data-k="expires_at" type="datetime-local"><label style="display:block;margin:12px 0"><input data-k="fallback" type="checkbox" style="width:auto"> Use alternate Smarters app for this customer</label></div><div><h3>Before You Release</h3><p class="muted">Verify payment or approve the trial, create the account in your provider panel, paste the credentials here, review the parsed fields, then release them to the customer portal.</p><label>Internal Notes</label><textarea class="notes" data-k="admin_note" placeholder="Example: AT&T customer, use Smarters only if branded app fails."></textarea><button class="green" data-save>SAVE & RELEASE CREDENTIALS</button><div class="status"></div></div></div></div>`}function render(){const o=cache.orders||[],t=cache.trials||[];const paidPending=o.filter(x=>x.status==='payment_claimed').length,trialPending=t.filter(x=>x.status==='requested').length,active=o.filter(x=>x.status==='activated').length+t.filter(x=>x.status==='active').length;stats.innerHTML=`<div class="stat"><span class="muted">Payment Pending</span><strong>${paidPending}</strong></div><div class="stat"><span class="muted">Trial Requests</span><strong>${trialPending}</strong></div><div class="stat"><span class="muted">Active / Released</span><strong>${active}</strong></div>`;dashboard.innerHTML='<h2>Needs Your Attention</h2>'+((o.filter(x=>x.status==='payment_claimed').map(x=>card('order',x)).join('')+t.filter(x=>x.status==='requested').map(x=>card('trial',x)).join(''))||'<div class="empty">Nothing needs action right now.</div>');paid.innerHTML='<h2>Paid Orders</h2>'+(o.map(x=>card('order',x)).join('')||'<div class="empty">No orders yet.</div>');trials.innerHTML='<h2>Trial Requests</h2>'+(t.map(x=>card('trial',x)).join('')||'<div class="empty">No trials yet.</div>');active.innerHTML='<h2>Active Customers</h2>'+((o.filter(x=>x.status==='activated').map(x=>card('order',x)).join('')+t.filter(x=>x.status==='active').map(x=>card('trial',x)).join(''))||'<div class="empty">No active customers yet.</div>');const soon=[];for(const x of t){if(x.expires_at){const ms=new Date(x.expires_at)-Date.now();if(ms<=3*864e5)soon.push(card('trial',x))}}expiring.innerHTML='<h2>Expiring Soon</h2>'+(soon.join('')||'<div class="empty">No trial expirations within 3 days. Paid subscription renewal alerts are also monitored separately.</div>')}async function load(){const d=await api('GET');cache=d;render()}loginBtn.onclick=async()=>{adminPin=pin.value.trim();try{await load();loginBox.classList.add('hidden');app.classList.remove('hidden');sessionStorage.setItem('itgold_admin_pin',adminPin)}catch(e){loginStatus.textContent=e.message}};refreshBtn.onclick=load;logoutBtn.onclick=()=>{sessionStorage.removeItem('itgold_admin_pin');location.reload()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.addEventListener('click',async e=>{const box=e.target.closest('[data-id]');if(e.target.matches('[data-parse]')){const raw=box.querySelector('[data-k="rawpaste"]').value;const p=parseCredentials(raw);const ps=box.querySelector('[data-parse-status]');if(ps)delete ps.dataset.trial24;applyParsed(box,p);const found=[p.username&&'username',p.password&&'password',p.dns_link&&'server/DNS',p.dns_link_for_samsung_lg&&'Samsung/LG DNS',p.package_name&&'package',p.connections&&'connections',p.expires_raw&&'expiration'].filter(Boolean);let msg=found.length?`Parsed: ${found.join(', ')}. Please review before sending.`:'I could not confidently identify fields. You can still fill them manually.';if(ps?.dataset.trial24==='1')msg+=' 24-hour expiry detected — the trial timer will be set automatically when you activate it.';ps.textContent=msg;return}if(e.target.matches('[data-clear]')){box.querySelector('[data-k="rawpaste"]').value='';box.querySelector('[data-parse-status]').textContent='';return}if(!e.target.matches('[data-save]'))return;const q=k=>box.querySelector(`[data-k="${k}"]`);e.target.disabled=true;e.target.textContent='SAVING...';try{await api('POST',{type:box.dataset.type,id:box.dataset.id,username:q('username').value.trim(),password:q('password').value.trim(),dns_link:q('dns_link').value.trim(),dns_link_for_samsung_lg:q('dns_link_for_samsung_lg').value.trim(),package_name:q('package_name').value.trim(),connections:Number(q('connections').value||1),expires_at:q('expires_at').value?new Date(q('expires_at').value).toISOString():null,use_fallback_app:q('fallback').checked,admin_note:q('admin_note').value.trim()});box.querySelector('.status:last-child').textContent='Credentials released to customer portal.';e.target.textContent='SAVED & RELEASED';setTimeout(load,500)}catch(err){box.querySelector('.status:last-child').textContent=err.message;e.target.disabled=false;e.target.textContent='SAVE & RELEASE CREDENTIALS'}});const saved=sessionStorage.getItem('itgold_admin_pin');if(saved){adminPin=saved;load().then(()=>{loginBox.classList.add('hidden');app.classList.remove('hidden')}).catch(()=>sessionStorage.removeItem('itgold_admin_pin'))}</script></body></html>
