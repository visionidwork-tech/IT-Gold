<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Gold Renewals Admin</title><style>:root{--g:#f4c44e}*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}h1,h2,h3{color:var(--g)}.card{background:#111;border:1px solid #2c2c2c;border-radius:14px;padding:18px;margin:14px 0}input{width:100%;padding:12px;background:#060606;color:#fff;border:1px solid #333;border-radius:8px}button,a{display:inline-block;padding:11px 15px;border:0;border-radius:8px;background:var(--g);color:#111;font-weight:900;text-decoration:none;margin:8px 6px 0 0}.muted{color:#aaa}.status{color:var(--g);margin-top:8px}.pill{display:inline-block;padding:5px 8px;background:#5a4813;color:#ffe49b;border-radius:999px;font-size:12px}.done{background:#153b28;color:#9ff2c3}</style></head><body><div class="wrap"><h1>IT Gold Renewal Admin</h1><div id="login" class="card"><h3>Admin Access</h3><input id="pin" type="password" inputmode="numeric" placeholder="Admin PIN"><button id="openBtn">OPEN RENEWALS</button><div id="loginStatus" class="status"></div></div><div id="app" style="display:none"><div><a href="/admin.html">MAIN ADMIN</a><button id="refreshBtn">REFRESH</button></div><h2>Renewal Payments</h2><div id="list"></div></div></div><script>const endpoint='https://bhfnlzvldmvwbuujexcj.supabase.co/functions/v1/itgold-admin';let adminPin='';async function api(method,body){const r=await fetch(endpoint,{method,headers:{'content-type':'application/json','x-admin-pin':adminPin},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(c){return'$'+((c||0)/100).toFixed(2)}function render(rows){list.innerHTML=(rows||[]).map(r=>{const c=r.customer||{},p=r.plan||{},s=Array.isArray(r.subscription)?r.subscription[0]:r.subscription;return`<div class="card"><h3>${esc(r.payment_code)} <span class="pill ${r.status==='completed'?'done':''}">${esc(r.status)}</span></h3><p><b>${esc(c.full_name)}</b><br>${esc(c.email)} • ${esc(c.phone||'')}</p><p>${esc(p.name||'Current Plan')} • ${p.connections||1} connection${(p.connections||1)>1?'s':''} • ${money(r.amount_cents)}</p><p>Paid via ${esc(r.payment_method)} from ${esc(r.payer_handle||'')}</p><p class="muted">Current expiration: ${s?.expires_at?new Date(s.expires_at).toLocaleString():'Not set'}</p>${r.status==='completed'?`<p class="muted">Completed ${r.completed_at?new Date(r.completed_at).toLocaleString():''}</p>`:`<button data-complete="${r.id}">MARK PAYMENT VERIFIED & RENEWED</button>`}</div>`}).join('')||'<div class="card muted">No renewal payments yet.</div>'}async function load(){const d=await api('GET');render(d.renewals||[])}openBtn.onclick=async()=>{adminPin=pin.value.trim();try{await load();sessionStorage.setItem('itgold_admin_pin',adminPin);login.style.display='none';app.style.display='block'}catch(e){loginStatus.textContent=e.message}};refreshBtn.onclick=load;document.addEventListener('click',async e=>{const id=e.target.dataset.complete;if(!id)return;e.target.disabled=true;e.target.textContent='UPDATING...';try{await api('POST',{type:'renewal',id});await load()}catch(err){alert(err.message);e.target.disabled=false}});const saved=sessionStorage.getItem('itgold_admin_pin');if(saved){adminPin=saved;load().then(()=>{login.style.display='none';app.style.display='block'}).catch(()=>{})}</script></body></html>
