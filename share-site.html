<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share IT Revised</title><meta name="theme-color" content="#000000"><style>body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{width:min(92vw,430px);text-align:center;background:#080808;border:1px solid #e3b83f;border-radius:22px;padding:28px;box-shadow:0 0 45px #e3b83f22}.logo{width:150px;max-height:100px;object-fit:contain}.eyebrow{color:#ffe88a;font-weight:800;letter-spacing:.16em;font-size:12px}h1{margin:10px 0 8px}p{color:#bbb;line-height:1.5}.qr{background:#fff;border-radius:16px;padding:14px;width:min(280px,80vw);margin:20px auto}.qr img{display:block;width:100%}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:14px;border-radius:10px;border:1px solid #e3b83f;background:linear-gradient(#ffe784,#d6a72d);color:#090704;font-weight:900;text-decoration:none;font-size:16px}.outline{background:#050505;color:#ffe88a}.url{color:#ffe88a;font-weight:700;word-break:break-all}</style></head><body><main class="card"><img class="logo" src="/IMG_20260914_233545_078.jpg" alt="IT Revised"><div class="eyebrow">SHARE IT REVISED</div><h1>Scan to Visit</h1><p>Point your phone camera at the QR code to open IT Revised.</p><div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=https%3A%2F%2Fitgold.shop" alt="QR code for itgold.shop"></div><div class="url">itgold.shop</div><button class="btn" id="shareBtn">SHARE IT REVISED</button><button class="btn outline" id="copyBtn">COPY WEBSITE LINK</button><a class="btn outline" href="/">BACK TO WEBSITE</a></main><script>const url='https://itgold.shop';shareBtn.onclick=async()=>{if(navigator.share){try{await navigator.share({title:'IT Revised',text:'Check out IT Revised',url})}catch{}}else{await navigator.clipboard.writeText(url);shareBtn.textContent='LINK COPIED
