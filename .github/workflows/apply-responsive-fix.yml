name: Apply responsive storefront fix
on:
  push:
    paths:
      - '.github/workflows/apply-responsive-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch responsive CSS
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='</style>'
          css='''@media(max-width:1100px){body{overflow-x:hidden}.hero{grid-template-columns:1fr;min-height:auto;padding:48px 0 34px}.heroVisual{display:none}.featurebar{grid-template-columns:repeat(3,1fr)}.plans{grid-template-columns:repeat(3,minmax(0,1fr))}.wrap{width:100%}}@media(max-width:850px){.wrap{padding:0 16px}.nav{min-height:78px;gap:12px}.brand img{width:96px;height:60px}.accountbtn{min-height:42px;padding:0 15px;font-size:12px}.hero{padding:42px 0 28px}.heroCopy{max-width:680px}.hero h1{font-size:clamp(44px,10vw,68px);line-height:.94}.hero p{font-size:16px}.international{font-size:16px!important}.actions .btn{flex:1 1 180px}.heroVisual{display:none!important}.featurebar{grid-template-columns:repeat(2,minmax(0,1fr));padding:16px 0;margin-bottom:30px}.feature{min-width:0}.plans,.flow,.reward,.account,.row,.pay-choice{grid-template-columns:1fr}.section{padding:42px 0}.card{padding:22px}.sectionhead h2{font-size:36px}.tabs{max-width:100%}.tab{padding:10px 20px}.panel{width:min(620px,100%);padding:22px}.checkout{padding:18px 10px}}@media(max-width:520px){.wrap{padding:0 14px}.brand img{width:88px;height:56px}.accountbtn{padding:0 12px}.hero{padding-top:34px}.heroCopy .eyebrow{font-size:11px;letter-spacing:.22em}.hero h1{font-size:clamp(40px,13vw,56px)}.hero p{line-height:1.5}.international{letter-spacing:.1em}.actions{gap:10px}.actions .btn{width:100%;flex-basis:100%}.featurebar{grid-template-columns:1fr 1fr}.feature{padding:12px 6px}.sectionhead h2{font-size:32px}.price{font-size:46px}.reward h2{font-size:34px}.payment-code{align-items:stretch;flex-direction:column}.copybtn{min-height:42px}.footer a{display:inline-block;margin:6px 7px}}'''
          if css not in s:
              s=s.replace(marker,css+marker,1)
              p.write_text(s)
      - name: Commit responsive fix
        run: |
          git config user.name "IT Revised Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Optimize IT Revised storefront for tablets and mobile"
          git push origin main
