name: One-time renewal credit UI update
on:
  push:
    paths:
      - '.github/workflows/one-time-renewal-credit-ui.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update renewal credit display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('renewal.html'); s=p.read_text()
          old="summary.innerHTML=`<p><b>${d.full_name}</b></p><p>${d.plan_name}</p><p>${d.connections} connection${d.connections>1?'s':''} • ${money(d.amount_cents)} ${d.billing_cycle==='monthly'?'per month':'per year'}</p><p>Current expiration: ${d.expires_at?new Date(d.expires_at).toLocaleString():'Not set'}</p>`;"
          new="summary.innerHTML=`<p><b>${d.full_name}</b></p><p>${d.plan_name}</p><p>${d.connections} connection${d.connections>1?'s':''}</p><p>Regular price: <b>${money(d.gross_amount_cents??d.amount_cents)}</b></p><p>Referral credit available: <b>-${money(d.referral_credit_applied_cents||0)}</b></p><p style=\"font-size:22px\">You pay: <b>${money(d.amount_cents)}</b></p><p>Current expiration: ${d.expires_at?new Date(d.expires_at).toLocaleString():'Not set'}</p><p><b>Refer & Save:</b> ${d.qualified_referrals||0} qualified • ${d.pending_referrals||0} pending • Balance ${money(d.referral_credit_balance_cents||0)}</p>`;"
          s=s.replace(old,new)
          old2="renewCode.textContent=code;cashText.innerHTML=`Pay <b>${money(account.amount_cents)}</b> and paste <b>${code}</b> into the payment note.`;venmoText.innerHTML=`Pay <b>${money(account.amount_cents)}</b> and paste <b>${code}</b> into the payment note.`;payCard.classList.remove('hidden');payCard.scrollIntoView({behavior:'smooth'})"
          new2="renewCode.textContent=code;if(account.amount_cents===0){cashText.innerHTML='<b>Your referral credit covers this renewal. No Cash App payment is needed.</b>';venmoText.innerHTML='No payment is needed for this renewal.';method.value='cash_app';payer.value='Referral Credit';submitBtn.textContent='USE MY REFERRAL CREDIT';}else{cashText.innerHTML=`Pay <b>${money(account.amount_cents)}</b> and paste <b>${code}</b> into the payment note.`;venmoText.innerHTML=`Pay <b>${money(account.amount_cents)}</b> and paste <b>${code}</b> into the payment note.`;}payCard.classList.remove('hidden');payCard.scrollIntoView({behavior:'smooth'})"
          s=s.replace(old2,new2)
          p.write_text(s)
          sw=Path('service-worker.js'); t=sw.read_text().replace("const CACHE='itgold-v5'","const CACHE='itgold-v6'"); sw.write_text(t)
          PY
      - name: Commit renewal UI
        run: |
          git config user.name 'IT Gold Automation'
          git config user.email 'visionidwork@gmail.com'
          git add renewal.html service-worker.js
          git diff --cached --quiet || git commit -m 'Show referral credits on renewals'
          git push
