name: One-time annual pricing update
on:
  push:
    paths:
      - '.github/workflows/one-time-annual-pricing.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update annual prices in customer UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('$150/yr','$200/yr').replace('$200/yr','$320/yr').replace('$250/yr','$440/yr')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'IT Gold Automation'
          git config user.email 'visionidwork@gmail.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Set annual plans to save 100 dollars'
          git push