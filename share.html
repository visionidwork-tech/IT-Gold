<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4c44e"><title>Share IT Gold</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/itgold-icon.svg" type="image/svg+xml"><style>:root{--g:#f4c44e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1a1509,#050505 38%);color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);background:#111;border:1px solid #4a3a13;border-radius:22px;padding:24px;text-align:center;box-shadow:0 20px 60px #0008}.brand{font-size:34px;font-weight:900;color:var(--g);margin:4px 0 8px}.sub{color:#bbb;line-height:1.45;margin:0 0 18px}.qr{background:#fff;border-radius:18px;padding:14px;width:min(300px,85vw);margin:0 auto 18px}.qr img{display:block;width:100%;height:auto}.btn{display:block;width:100%;padding:14px;margin:10px 0;border:0;border-radius:12px;background:var(--g);color:#111;font-weight:900;font-size:16px;text-decoration:none;cursor:pointer}.secondary{background:#191919;color:var(--g);border:1px solid #4a3a13}.status{min-height:20px;color:#bbb;font-size:13px;margin-top:8px}.back{display:inline-block;color:#999;text-decoration:none;margin-top:12px;font-size:13px}</style></head><body><main class="card"><div class="brand">IT GOLD</div><h1>Share IT Gold</h1><p class="sub">Have them scan this QR code with their phone. It opens IT Gold so they can install the app on their device.</p><div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=12&data=https%3A%2F%2Fitgold.shop" alt="QR code to get IT Gold"></div><button class="btn" id="shareBtn">SHARE IT GOLD</button><button class="btn secondary" id="copyBtn">COPY IT GOLD LINK</button><div class="status" id="status"></div><a class="back" href="/">← Back to IT Gold</a></main><script>const url='https://itgold.shop',status=document.getElementById('status'),shareBtn=document.getElementById('shareBtn'),copyBtn=document.getElementById('copyBtn');shareBtn.onclick=async()=>{try{if(navigator.share){await navigator.share({title:'IT Gold',text:'Get the IT Gold app',url})}else{await navigator.clipboard.writeText(url);status.textContent='IT Gold link copied — share it with them.'}}catch(e){if(e.name!=='AbortError')status.textContent='Use Copy IT Gold Link below.'}};copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(url);status.textContent='IT Gold link copied.'}catch(e){status.textContent=url}};</script></body></html>
